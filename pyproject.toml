[project]
name = "watchpost"
version = "0.2.0rc1"
description = "Code driven monitoring checks for Checkmk"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pit Kleyersburg", email = "pitkley@googlemail.com" },
]
requires-python = ">=3.13"
keywords = [
    "monitoring",
    "checkmk",
    "observability",
    "infrastructure",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=1.6.0,<2.0.0",
    "timelength>=3.0.4,<3.1.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.5.0,<9.0.0",
    "rich>=15.0.0,<16.0.0",
]
redis = [
    "redis>=8.1.0,<9.0.0",
]

[project.scripts]
watchpost = "watchpost.cli:main"

[project.urls]
Homepage = "https://github.com/pitkley/watchpost"
Documentation = "https://pitkley.github.io/watchpost/"
Repository = "https://github.com/pitkley/watchpost.git"
Issues = "https://github.com/pitkley/watchpost/issues"
Changelog = "https://github.com/pitkley/watchpost/releases"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # CLI tests and type checks require these even without the cli extra.
    # Their version constraints remain in project.optional-dependencies.cli.
    "click",
    "rich",
    "httpx2>=2.12.0,<3.0.0",
    "lefthook>=2.1.12,<2.2.0",
    "licensecheck>=2026.0.8,<2027.0.0",
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<9.2.0",
    "ruff>=0.16.6,<0.17.0",
    "testcontainers[redis]>=4.15.0,<5.0.0",
    "ty>=0.0.78,<0.1.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-code-validator>=0.2.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.6",
]

[tool.licensecheck]
only_licenses = [
    "Apache-2.0",
    "BSD-2-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "PSF-2.0",
]
ignore_packages = [
    "mypy-extensions", # MIT licensed, information missing
]
groups = [
    "dev",
]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

exclude = [
    "tests/.*"
]

[tool.pytest]
strict = true
markers = [
    "docker: marks tests that require Docker (deselect with '-m \"not docker\"')",
]

[tool.ruff.lint]
extend-select = [
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez
    "FAST", # FastAPI
    "I",    # isort
    "RUF",  # Ruff-specific rules
    "T20",  # flake8-print
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"examples/**.py" = [
    "T20",  # flake8-print
]

[tool.ty.src]
exclude = [
    "checkmk-integration/watchpost-plugin/",
    "tests/",
]

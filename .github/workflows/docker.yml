---
name: Docker

"on":
  push:
    branches:
    - main
  workflow_call:

permissions:
  contents: read

env:
  CHECKMK_VERSION: "2.4.0p30"

jobs:
  cmk-docker-build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/pitkley/watchpost/checkmk
        # Legacy latest and Checkmk-only tags stay on their existing images.
        flavor: latest=false
        tags: |
          type=raw,value=edge-checkmk-${{ env.CHECKMK_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
          type=pep440,pattern={{version}},suffix=-checkmk-${{ env.CHECKMK_VERSION }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: "{{defaultContext}}:checkmk-integration"
        file: "Dockerfile.checkmk"
        build-args: |
          CHECKMK_VERSION=${{ env.CHECKMK_VERSION }}
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
